openapi: 3.1.0
info:
  title: Patterna API
  version: 0.1.0
  description: |
    Proof-first recommendation platform. Three key scopes: `serve` (recommendations and
    interactions; keys start `pk_s_`), `ingest` (events, catalog, user consent, profile and
    deletion; `pk_i_`), `admin` (tenant configuration, proof, exports; `pk_a_`). A key of a higher
    scope passes a lower one (admin > ingest, serve). Every request carries
    `Authorization: Bearer <key>` (the two webhooks authenticate themselves instead); the tenant is
    derived from the key, never from the body. Every response carries `X-Request-Id`; send your
    own (at most 64 characters) to correlate, and on `POST /recommendations` it becomes the slate's
    request id. Browsers may send `X-Request-Id`, `X-Trace-Id`, `X-Deadline-Ms` and
    `X-Patterna-Tester` cross-origin (CORS).

    Conventions:
    - JSON bodies are strict: an unknown field is a 400 `bad_request`.
    - Positions start at 0: `items[0]` has `position: 0`.
    - Deletion (`DELETE /users/{id}`) is immediate: rows are deleted or unlinked in the request;
      only model retraining follows later (`models_retrained_at`).

    Error codes (`Error.code`), by status:
    - 400: `bad_request`, `invalid_reason_template`, `metric_not_applicable`
    - 401: `unauthorized`, `wrong_scope`, `bad_credentials`, `bad_mfa`, `mfa_pending`, `bad_signature`, `webhook_not_configured`
    - 403: `forbidden`, `forbidden_role`, `forbidden_scope`, `staff_only`, `session_required`, `same_person`, `mfa_enrolment_required`
    - 404: `not_found`, `unknown_surface`, `unknown_request`, `unknown_flow_version`, `item_not_found`
    - 409: `surface_off`, `experiment_running`, `signing_secret_exists`, `exists`, `approval_required`, `approval_pending`, `approval_decided`, `no_endpoints`, `deletion_scheduled`, `export_not_ready`, `last_owner`, `already_member`, `seat_limit`, `mfa_enforced`
    - 422: `mode_conflict`, `no_candidates`, `unknown_item`, `displayed_position_required`, `pii_rejected` (catalog attributes), `bad_tester_id`, `bad_webhook_url`, `bad_slack_webhook`, `unknown_parent`, `parent_cycle`
    - 429: `rate_limited`, `account_locked`, `too_many_attempts`
    - 500: `internal` (with the request id)
    Per-event codes in `POST /events` → `rejected[].code`: `invalid_event`, `pii_rejected`,
    `invalid_signature`, `no_signing_secret`, `unknown_request`, `unknown_item`,
    `displayed_position_required`.
servers:
  - url: https://patterna-api.orven.am/v1
    description: production (EU)
  - url: http://localhost:5300/v1
    description: local
security:
  - apiKey: []
tags:
  - { name: serve, description: recommendations and the interaction loop }
  - { name: ingest, description: canonical events in }
  - { name: catalog, description: "items, products, communities and their tags" }
  - { name: proof, description: "holdout, ledger, replay" }
  - { name: admin, description: "surfaces, flows, keys, users, exports" }
  - { name: operator, description: "the operator area (/admin): Ainur staff sessions only" }
  - { name: accounts, description: "sign-in, MFA, passwords, invites, people and sessions (docs/ACCOUNTS_API.md)" }

paths:
  /recommendations:
    post:
      tags: [serve]
      summary: Rank a slate for a surface
      operationId: recommend
      description: |
        Returns a slate of items with a reason key per slot and the request id the caller must
        echo back in `/interactions`. The impression is logged with per-position propensities.
        In `non_profiled` mode `user_id` must be absent (422 `mode_conflict`).

        Timeouts: the engine answers within its budget (`SERVE_BUDGET`, default 120 ms, below the
        SDKs' 150 ms) or within the client's deadline (`X-Deadline-Ms` or `deadline_ms`, minus a
        tenth for the network), whichever is shorter; past it, it answers the surface's
        non-personalized list with `fallback: true`. A client that gave up anyway reports it with
        `POST /recommendations/{request_id}/abandon`, so the fallback rate and the ledger see it.

        Errors that are not fallbacks (fix the request): 400, 404 `unknown_surface`, 422
        `mode_conflict`. Errors where the caller shows its own list: 409 `surface_off`, 422
        `no_candidates` (nothing left after the filters), 429, 5xx.
      parameters:
        - { name: X-Deadline-Ms, in: header, schema: { type: integer, minimum: 10, maximum: 10000 }, description: "the client's own deadline in milliseconds; the engine answers before it" }
        - { name: X-Request-Id, in: header, schema: { type: string, maxLength: 64 }, description: "a client-minted id (at most 64 characters) becomes the slate's request id, so the client can abandon a slate whose answer never arrived; without it the engine mints one" }
        - { name: X-Patterna-Tester, in: header, schema: { type: string, enum: ['1'] }, description: "from the customer's backend: this user is on the customer's tester roster. A surface in `testers` status serves the ranked list to the request (counted in `tester_requests_7d` and audited once a day per surface). Patterna ids never need to be known." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendRequest' }
      responses:
        '200':
          description: a slate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /recommendations/{request_id}/abandon:
    post:
      tags: [serve]
      summary: The client gave up on this slate and showed its own list
      operationId: abandonRecommendation
      description: |
        Flags the impression `fallback: true, client_abandoned: true`. It counts in the fallback
        rate and stays in its arm in the ledger (intention to treat: dropping it would flatter the
        slower arm). Idempotent. Call it when the client's deadline passed, or when the app hid
        the block for its own reasons.
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [timeout, server_error, network_error, bad_response, client_fallback], description: why the client gave up; stored with the impression }
      responses:
        '200':
          description: flagged
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: { type: string }
                  arm: { type: string, enum: [control, treatment, none] }
                  fallback: { type: boolean }
                  client_abandoned: { type: boolean }
                  reason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /interactions:
    post:
      tags: [serve]
      summary: Report seen, click, dismiss by request id
      operationId: reportInteractions
      description: |
        Every `item_id` must be in the slate served for `request_id` (422 `unknown_item` with
        `details.unknown_item_ids`). The item's kind and served position come from the logged
        slate; a client `kind` is ignored. On a surface with `device_resort` every interaction must
        carry `displayed_position` (422 `displayed_position_required`). Report only for users who
        allowed usage analytics; the others are requested with `context.measured: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, interactions]
              properties:
                request_id: { type: string }
                interactions:
                  type: array
                  maxItems: 50
                  items: { $ref: '#/components/schemas/Interaction' }
      responses:
        '202': { description: accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /events:
    post:
      tags: [ingest]
      summary: Ingest canonical events (batch)
      operationId: ingestEvents
      description: |
        Up to 500 events per call, idempotent on `event_id`. Events sent with an ingest or admin
        key are marked `signed`. Any event that carries a `signature` is verified against the
        tenant's signing secret (the string `POST /settings/signing-secret` returned, used as the
        HMAC key byte for byte); a wrong signature rejects the event (`invalid_signature`), a
        tenant without a secret rejects it (`no_signing_secret`). There is no separate SDK scope:
        sign on your backend.

        Each event is judged on its own and the call answers 202:
        - personal data (a PII field name such as `email` or `name` in props or context, or an
          email or `provider|id` as `user_id`) rejects the event with `pii_rejected` and the
          offending field paths in `fields`; nothing of it is stored;
        - a field that is not in the type's allowlist and is not PII is dropped and counted in
          `dropped_fields`;
        - `rec_*` events with a `request_id` follow the `/interactions` rules (`unknown_item`,
          `displayed_position_required`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/Event' }
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  pii_rejected: { type: integer, description: events refused for personal data }
                  dropped_fields: { type: object, additionalProperties: { type: integer }, description: "dropped non-PII keys per <type>.<field> or context.<field>" }
                  rejected:
                    type: array
                    items:
                      type: object
                      required: [event_id, reason, code]
                      properties:
                        event_id: { type: string }
                        reason: { type: string }
                        code: { type: string, enum: [invalid_event, pii_rejected, invalid_signature, no_signing_secret, unknown_request, unknown_item, displayed_position_required] }
                        fields: { type: array, items: { type: string }, description: "pii_rejected: the field paths (names only, never values)" }
        '400': { $ref: '#/components/responses/BadRequest' }

  /catalog/items:
    put:
      tags: [catalog]
      summary: Upsert items (batch)
      operationId: upsertItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/ItemUpsert' }
      responses:
        '200':
          description: upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  upserted: { type: integer }
                  enrichment_queued: { type: integer }
    get:
      tags: [catalog]
      summary: List items, or the items changed since a point in time
      operationId: listItems
      description: |
        With `changed_since` the page holds every item created or changed at or after that instant
        (archived included), for a nightly reconcile; page with `cursor` as usual. Deleted items
        (`DELETE /catalog/items/{external_id}`) no longer appear.
      parameters:
        - { name: changed_since, in: query, schema: { type: string, format: date-time }, description: RFC 3339 }
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        '200':
          description: page of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  next_cursor: { type: [string, 'null'] }

  /catalog/items/{external_id}:
    get:
      tags: [catalog]
      summary: Read one item
      operationId: getItem
      parameters:
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, default: document } }
      responses:
        '200':
          description: the item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [catalog]
      summary: Delete an item for good (audited)
      operationId: deleteItem
      description: |
        Removes the item, its tags and body text, and every reference the precompute tables and
        curated lists hold (user shortlists, item neighbours, curated list entries). Logged slates
        keep the id, so the ledger does not change after the fact. Archive instead
        (`POST /catalog/items/{external_id}/status`) to keep it restorable. Ingest or admin key.
      parameters:
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, default: document } }
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_id: { type: string }
                  kind: { type: string }
                  deleted: { type: boolean }
                  tags_removed: { type: integer }
                  references_removed: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog/items/{external_id}/status:
    post:
      tags: [catalog]
      summary: Change an item's status (archive, schedule, publish)
      operationId: setItemStatus
      parameters:
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, scheduled, published, archived] }
                published_at: { type: string, format: date-time }
      responses:
        '200': { description: updated }

  /catalog/items/{external_id}/tags:
    put:
      tags: [catalog]
      summary: Set editor-approved tags for an item
      operationId: setItemTags
      parameters:
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: object
                    required: [tag]
                    properties:
                      tag: { type: string }
                      weight: { type: number, default: 1 }
                      approved: { type: boolean, default: true }
      responses:
        '200': { description: updated }

  /users/{user_id}/mode:
    put:
      tags: [ingest]
      summary: Set a user's consent mode
      operationId: setUserMode
      description: |
        Ingest key (the customer's backend owns consent) or admin key. Switching to
        `non_profiled` deletes the user row at once, keeps a salted opt-out marker and queues model
        retraining.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/Mode' }
      responses:
        '200': { description: updated }

  /users/{user_id}/profile:
    put:
      tags: [ingest]
      summary: Set the user's declared attributes as tag affinities
      operationId: setUserProfile
      description: |
        Ingest or admin key. Goals, activity, stress, wearable, premium flag. Never health values.
        422 `mode_conflict` for a `non_profiled` user (or one who opted out) unless the body sets
        the mode explicitly.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfile' }
      responses:
        '200': { description: updated }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /users/{user_id}:
    delete:
      tags: [ingest]
      summary: Delete every row about a user (immediate) and schedule retraining
      operationId: deleteUser
      description: |
        Ingest or admin key. Immediate: the user row, assignments, events and shortlist are deleted
        and logged slates are unlinked (the salted `unit_hash` keeps the ledger stable) inside the
        request; `rows_deleted_at` is set in the answer. Only the model retraining follows
        (`models_retrained_at`, nightly). The request is recorded with a salted hash, not the id.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: rows deleted; retraining queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
    get:
      tags: [admin]
      summary: Export every row about a user
      operationId: exportUser
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the user's data
          content:
            application/json:
              schema: { type: object }

  /users/{user_id}/trace:
    get:
      tags: [admin]
      summary: Why did this user see what they saw (last N requests)
      operationId: userTrace
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { $ref: '#/components/parameters/IncludeSynthetic' }
      responses:
        '200':
          description: traces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trace' }

  /surfaces:
    get:
      tags: [admin]
      summary: List surfaces with status and the active flow version
      operationId: listSurfaces
      parameters:
        - { $ref: '#/components/parameters/IncludeSynthetic' }
      responses:
        '200':
          description: surfaces
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Surface' } }
    post:
      tags: [admin]
      summary: Create a surface
      operationId: createSurface
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurfaceInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Surface' }

  /surfaces/{key}:
    patch:
      tags: [admin]
      summary: Update a surface (status, slots, exploration share, fallback, testers, notes)
      operationId: updateSurface
      description: A status change notifies and enqueues `surface.status_changed`.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurfaceInput' }
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Surface' }

  /surfaces/{key}/flows:
    get:
      tags: [admin]
      summary: Flow versions of a surface
      operationId: listFlows
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: versions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Flow' } }
    post:
      tags: [admin]
      summary: Create a new flow version (not yet active)
      operationId: createFlow
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { $ref: '#/components/schemas/FlowConfig' }
                note: { type: string }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flow' }

  /surfaces/{key}/flows/{version}/activate:
    post:
      tags: [admin]
      summary: Activate a flow version (audited; previous stays rollable)
      operationId: activateFlow
      description: |
        Optional body `{note}`. On a live surface of a tenant with the two-person rule this answers
        409 `approval_required`; request one with POST /approvals.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: activated }

  /surfaces/{key}/simulate:
    post:
      tags: [proof]
      summary: Replay a flow config on logged traffic (offline evaluation)
      operationId: simulateFlow
      description: |
        Runs the given config on the last N days of impressions and returns SNIPS estimates of the
        primary metric with effective sample size, plus the twin simulator's curve when the tenant
        has one. Does not change anything.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { $ref: '#/components/schemas/FlowConfig' }
                days: { type: integer, default: 14 }
      responses:
        '200':
          description: estimates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }

  /experiments:
    get:
      tags: [proof]
      summary: Experiments (holdouts) per surface
      operationId: listExperiments
      responses:
        '200':
          description: experiments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Experiment' } }
    post:
      tags: [proof]
      summary: Start a holdout on a surface
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExperimentInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }

  /experiments/{id}/end:
    post:
      tags: [proof]
      summary: End a running experiment
      operationId: endExperiment
      description: Sets `ended_at`; the ledger keeps reading the experiment's window `[started_at, ended_at)`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deletion-requests:
    get:
      tags: [admin]
      summary: The tenant's deletion requests (newest 200)
      operationId: listDeletionRequests
      responses:
        '200':
          description: requests; `user_id` is `sha256:<salted hash>` for requests through DELETE /users/{id}
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeletionRequest' } }

  /proof/exports/{id}:
    get:
      tags: [proof]
      summary: Poll a proof export
      operationId: exportStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [running, done, failed] }
                  uri: { type: [string, 'null'] }
                  files: { type: array, items: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }

  /settings/signing-secret:
    post:
      tags: [admin]
      summary: Create the tenant's first event signing secret (owners, staff, admin keys)
      operationId: createSigningSecret
      description: |
        Returns the secret once. Sign events with exactly this string as the HMAC-SHA256 key (its
        UTF-8 bytes; nothing to decode), as the SDKs do. 409 `signing_secret_exists` when one was
        issued already: rotate it.
      responses:
        '200': { $ref: '#/components/responses/SigningSecret' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /settings/signing-secret/rotate:
    post:
      tags: [admin]
      summary: Replace the signing secret (owners, staff, admin keys)
      operationId: rotateSigningSecret
      description: |
        Returns the new secret once. Events signed with the old one stop verifying at once:
        deploy the new secret to your backend, then rotate. Also creates a first secret.
      responses:
        '200': { $ref: '#/components/responses/SigningSecret' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /proof/ledger:
    get:
      tags: [proof]
      summary: The proof ledger
      operationId: ledger
      description: |
        Without `bucket`: one summary row per surface with the user-clustered interval. With
        `bucket=week`: weekly rows per arm for the chart (Wilson intervals per impression, UTC weeks
        from Monday; default the last 12 weeks).
      parameters:
        - { name: surface, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: bucket, in: query, schema: { type: string, enum: [week] } }
        - { $ref: '#/components/parameters/IncludeSynthetic' }
      responses:
        '200':
          description: ledger rows with intervals, or weekly rows when bucket=week
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: '#/components/schemas/LedgerRow' } }
                  - { type: array, items: { $ref: '#/components/schemas/LedgerWeek' } }

  /proof/export:
    post:
      tags: [proof]
      summary: Export impressions and interactions for a period so the ledger can be recomputed
      operationId: exportProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                surface: { type: string }
      responses:
        '202':
          description: export job queued; a signed URL arrives on the job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }

  /connectors:
    get:
      tags: [admin]
      summary: Connector status per source (last run, health, setup values)
      operationId: listConnectors
      responses:
        '200':
          description: connectors
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConnectorRun' } }

  /webhooks/posthog:
    post:
      tags: [ingest]
      summary: PostHog destination endpoint (maps and drops per contracts/events.md)
      operationId: posthogWebhook
      description: |
        Authenticated by the tenant's PostHog token in `X-Patterna-Token` (set it with
        `PATCH /settings` `posthog_token`; Patterna stores only its SHA-256), not by an API key.
        A distinct id is never stored raw: an id the importer minted (`u_` + 26 base32 characters)
        is kept, anything else (an Auth0 subject, an email) is minted with the tenant's
        `PATTERNA_ID_SECRET` exactly as the importer does, or dropped when no secret is set.
      security: []
      parameters:
        - { name: X-Patterna-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { description: one PostHog event or an array of events }
      responses:
        '202': { description: accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/shopify/{tenant}:
    post:
      tags: [ingest]
      summary: Shopify orders/create and products/update (authenticated by Shopify's HMAC only)
      operationId: shopifyWebhook
      description: |
        Shopify cannot send an API key: the tenant slug is in the path and `X-Shopify-Hmac-Sha256`
        (base64 HMAC-SHA256 of the raw body under the tenant's `shopify_webhook_secret`) is the
        only authentication. Without a configured secret the endpoint refuses every call (401
        `webhook_not_configured`); a wrong signature is 401 `bad_signature`.
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: X-Shopify-Hmac-Sha256, in: header, required: true, schema: { type: string } }
        - { name: X-Shopify-Topic, in: header, required: true, schema: { type: string } }
      responses:
        '202': { description: accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /keys:
    get:
