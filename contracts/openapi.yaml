      operationId: authInviteAccept
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string }, name: { type: string, maxLength: 120 } } }
      responses:
        '200':
          description: accepted and signed in
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, mfa_required: { type: boolean, description: the existing account has TOTP; finish with POST /auth/mfa }, mfa_setup_required: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/set-password:
    post:
      tags: [accounts]
      security: []
