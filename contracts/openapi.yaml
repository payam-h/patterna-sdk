        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200':
          description: the invite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/invites/accept:
    post:
      tags: [accounts]
      security: []
