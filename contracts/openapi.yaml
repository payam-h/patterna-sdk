        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password/reset:
    post:
      tags: [accounts]
      security: []
      summary: Set a new password with a reset token (1 hour, single use)
      operationId: authResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 12, maxLength: 256 } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/invites/lookup:
    post:
