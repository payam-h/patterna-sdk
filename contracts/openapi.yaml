      responses:
        '200':
          description: keys
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
    post:
      tags: [admin]
      summary: Create a key; the secret is returned once
      operationId: createKey
      description: |
        Owner sessions and staff mint any scope. An admin key mints `ingest` and `serve` keys only
