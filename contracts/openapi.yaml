        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/tenants:
    get:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Tenants this person can switch to
      operationId: authTenants
      responses:
        '200':
          description: memberships (staff see every tenant)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MembershipRef' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/tenant:
    post:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Switch the session's tenant
      operationId: authSwitchTenant
      description: Staff entering a tenant they are not a member of is support access, audited as `support.access` in that tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [slug], properties: { slug: { type: string }, reason: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: switched
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, role: { type: string }, support: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/mfa/enrol:
    post:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Start (or redo) TOTP enrolment
      operationId: authMfaEnrol
      description: When TOTP is already on, a valid current `code` is required; the live secret keeps working until the new one is confirmed.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { code: { type: string } } }
      responses:
        '200':
          description: a pending secret
          content:
            application/json:
              schema: { type: object, required: [otpauth_url, secret], properties: { otpauth_url: { type: string }, secret: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/defer:
    post:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Skip two-step enrolment for now (seven days)
      description: >-
        "Skip for now" on the enrolment screen. Enrolment stays required (staff, or a workspace that
        enforces it); the person may work without a second factor for seven days, then the screen
        returns. Audited as `mfa.deferred`. Refused with `409 mfa_enabled` once TOTP is on.
      operationId: authMfaDefer
      responses:
        '200':
          description: Deferred
          content:
            application/json:
              schema:
                type: object
                required: [ok, until]
                properties:
                  ok: { type: boolean }
                  until: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/mfa/confirm:
    post:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Confirm the pending TOTP secret with a code
      operationId: authMfaConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeInput' }
      responses:
        '200':
          description: TOTP on
          content:
            application/json:
              schema: { type: object, properties: { mfa_enabled: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/disable:
    post:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Turn TOTP off with a valid code
      operationId: authMfaDisable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeInput' }
      responses:
        '200':
          description: TOTP off
          content:
            application/json:
              schema: { type: object, properties: { mfa_enabled: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/password:
    post:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Change your password (current password required)
      operationId: authChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 12, maxLength: 256 } } }
      responses:
        '200':
          description: changed; every other session ended
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, sessions_revoked: { type: integer } } }
