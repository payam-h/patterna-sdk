    post:
      tags: [operator]
      security: [{ panelSession: [] }]
      summary: Invite a person to join staff
      operationId: staffCreateInvite
      parameters:
        - { name: reveal, in: query, schema: { type: string, enum: ['1'] } }
      requestBody:
        required: true
