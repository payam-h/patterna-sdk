      summary: Revoke a staff invite
      operationId: staffRevokeInvite
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [admin]
      security: []
      summary: Liveness and dependency status
      operationId: health
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  postgres: { type: string }
                  redis: { type: string }
                  version: { type: string }

  # ---- panel backends (docs/PANEL_API.md, "Panel backends") -----------------------------------
  /connectors/sources:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Connectable sources in display order, each with status, setup values and recent runs
      operationId: listConnectorSources
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConnectorSource' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/alerts/test:
    post:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Send a test alert (owners, staff, admin keys)
      description: |
        Writes one notification of kind `alert_test` and, when an alert address is set and the
        database has an `email_outbox` table, one email row for the jobs to deliver. Slack delivery is
        the jobs' as well; the answer says whether a webhook is configured.
      operationId: testAlerts
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalog/enrich/runs:
    get:
      tags: [catalog]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Enrichment run history (written by the jobs' enrich job), newest first
      operationId: listEnrichRuns
      parameters:
        - { name: external_id, in: query, schema: { type: string }, description: "only runs that touched this item, each with the item's outcome" }
        - { name: kind, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /catalog/gold:
    get:
      tags: [catalog]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: The gold set with precision and recall of the current tags against it
      operationId: getGoldSet
      parameters:
        - { name: sample, in: query, schema: { type: integer, minimum: 1, maximum: 200 }, description: also return a stable sample of unlabelled published items }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoldSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [catalog]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Replace the gold set (editors and up); scores it and stores the score in the history
      operationId: putGoldSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoldSetInput' }
      responses:
        '200':
          description: the new gold set and its score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoldSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /catalog/items/bulk:
    post:
      tags: [catalog]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Change status, collection and tags of up to 500 items at once (editors and up, audited)
      description: |
        Health-claim tags (the taxonomy's `health_claim`, or a `claim:` prefix) are never approved in
        bulk: adding or approving one opens a `claim_tag` approval request instead.
      operationId: bulkItems
      parameters:
        - { name: note, in: query, schema: { type: string }, description: audit note (also accepted in the body) }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkItemsInput' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkItemsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audiences/cohorts:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Declared-goal and persona cohorts with sizes and tap rates
      description: |
        Profiled users only (non_profiled traffic belongs to no cohort). A user with several goals
        counts in each. Tap rate is taps over seen slots of the members' slates in the window.
      operationId: audienceCohorts
      parameters:
        - { $ref: '#/components/parameters/IncludeSynthetic' }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 180, default: 28 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cohorts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /audiences/consent:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Consent changes into each mode per ISO week (Monday, UTC), zero-filled, current week last
      operationId: consentTimeline
      parameters:
        - { $ref: '#/components/parameters/IncludeSynthetic' }
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentTimeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /surfaces/{key}/heatmap:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Seen and tap rate per served position per UTC day (shadow slates excluded)
      operationId: surfaceHeatmap
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IncludeSynthetic' }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 28 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Heatmap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /annotations:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Chart annotations (user notes plus changes read from the audit log)
      operationId: listAnnotations
      parameters:
        - { name: surface, in: query, schema: { type: string }, description: that surface's markers plus the workspace-wide ones }
        - { name: from, in: query, schema: { type: string }, description: date or RFC 3339 time (default 90 days ago) }
        - { name: to, in: query, schema: { type: string }, description: date or RFC 3339 time (default now) }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Annotation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      security: [{ panelSession: [] }]
      summary: Write a note on the charts (editors and up; a panel user is the author)
      operationId: createAnnotation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /annotations/{id}:
    delete:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Delete a note (its author or an owner)
      operationId: deleteAnnotation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /presence:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Panel users seen in the last 60 seconds, newest first (in memory)
      operationId: getPresence
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PresenceEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      security: [{ panelSession: [] }]
      summary: Heartbeat (every 20 to 30 s); answers with the current list
      operationId: postPresence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, maxLength: 200, description: the panel path the user is on }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PresenceEntry' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /scheduled-reports/{id}/send:
    post:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Queue a send now (editors and up); a send already queued is returned instead
      operationId: sendReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: queued; the jobs render and deliver it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSend' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scheduled-reports/{id}/history:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Sends of one report, newest first
      operationId: reportHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportSend' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings/export:
    post:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Export the workspace (owners, staff, admin keys)
      description: |
        A zip of items, surfaces, flows, experiments, the published ledger and the live ledger of the
        last year as CSV files, written to EXPORT_DIR. Real rows only; the event log is not in it (that
        is the proof export, per period).
      operationId: exportWorkspace
      responses:
        '201':
          description: written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/exports/{id}:
    get:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Download a workspace export (owners, staff, admin keys)
      operationId: downloadWorkspaceExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /proof/exports/{id}/download:
    get:
      tags: [proof]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Download a proof export's CSV files as one zip (editors and up)
      operationId: downloadProofExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /settings/delete-workspace:
    post:
      tags: [admin]
      security: [{ panelSession: [] }]
      summary: Schedule the workspace's deletion seven days out (owners)
      description: |
        `confirm` must be the workspace slug. With the two-person rule on, the request becomes a
        `workspace_deletion` approval another owner must approve; approving schedules it. Cancellable
        until the date; the jobs delete every row of the workspace then.
      operationId: deleteWorkspace
      parameters:
        - { name: note, in: query, schema: { type: string }, description: audit note (also accepted in the body) }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: the workspace slug }
                note: { type: string }
      responses:
        '202':
          description: scheduled, or waiting for approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDeletion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/delete-workspace/cancel:
    post:
      tags: [admin]
      security: [{ apiKey: [] }, { panelSession: [] }]
      summary: Cancel a scheduled deletion and withdraw a pending deletion request (owners, staff, admin keys)
      operationId: cancelWorkspaceDeletion
      responses:
        '200':
          description: cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cancelled_schedule: { type: boolean }
                  withdrawn_approvals: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Scoped tenant key, hashed at rest.
    panelSession:
      type: apiKey
      in: cookie
      name: patterna_session
      description: Panel session (password + TOTP or Orven magic login). Staff sessions carry the operator role.

  parameters:
    IncludeSynthetic:
      name: include_synthetic
      in: query
      description: true selects only the example data set (rows flagged synthetic); the default selects only real rows. Never both.
      schema: { type: boolean, default: false }

  responses:
    Ok:
      description: done
      content:
        application/json:
          schema: { type: object, properties: { ok: { type: boolean } } }
    Revoked:
      description: sessions ended
      content:
        application/json:
          schema: { type: object, properties: { revoked: { type: integer } } }
    InviteCreated:
      description: the invite (emailed); the token only for staff asking with reveal=1
      content:
        application/json:
          schema: { type: object, required: [invite], properties: { invite: { $ref: '#/components/schemas/Invite' }, token: { type: string } } }
    KeyCreated:
      description: the key with its secret, shown once
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ApiKey' }
              - type: object
                properties:
                  secret: { type: string }
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: "missing, revoked, expired or wrongly scoped key, or no session (unauthorized, wrong_scope, bad_credentials, bad_mfa, mfa_pending)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: "per-key or per-user limit hit (rate_limited, account_locked with details.retry_after_seconds, too_many_attempts)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: "the request is well formed but cannot be applied (mode_conflict, no_candidates, unknown_item with details.unknown_item_ids, displayed_position_required, pii_rejected, bad_tester_id, bad_webhook_url, bad_slack_webhook, unknown_parent, parent_cycle)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: "the role may not do this (forbidden_role, forbidden_scope, staff_only, session_required, same_person, mfa_enrolment_required)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: "no such resource in this tenant (not_found, unknown_surface, unknown_request, unknown_flow_version, item_not_found)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: "state conflict (surface_off, experiment_running, signing_secret_exists, approval_required, approval_pending, approval_decided, exists, no_endpoints, deletion_scheduled, export_not_ready, last_owner, already_member, seat_limit, mfa_enforced)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    SigningSecret:
      description: the secret, shown once
      content:
        application/json:
          schema:
            type: object
            required: [signing_secret]
            properties:
              signing_secret: { type: string, description: "pss_ followed by 64 hex characters; the HMAC key is this string's UTF-8 bytes" }
              issued_at: { type: string, format: date-time }
              note: { type: string }

    Gone:
      description: the file behind the resource was removed (exports are kept for the retention period)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, description: "stable machine code; the full list is in the API description" }
        message: { type: string }
        request_id: { type: string }
        details: { type: object }

    Mode:
      type: string
      enum: [personalized, cohort, non_profiled]

    RecommendRequest:
      type: object
      required: [surface, mode, context]
      properties:
        surface: { type: string, example: home_articles }
        mode: { $ref: '#/components/schemas/Mode' }
        user_id: { type: string, description: absent in non_profiled mode }
        session_id: { type: string, description: rotating id; required in non_profiled mode }
        context:
          type: object
          required: [locale]
          properties:
            locale: { type: string, example: nl, description: "a language tag; matched on its base language (nl-NL → nl) against every locale an item carries. A locale no published item carries widens to all items." }
            app_version: { type: string }
            platform: { type: string, enum: [ios, android, web] }
            hour_bucket: { type: integer, minimum: 0, maximum: 23 }
            anchor_item_id: { type: string, description: "the item the user is on (an article, a community). Resolved against the whole catalog, any kind: an article can anchor a product list (reason pairs_with)." }
            premium: { type: boolean }
            candidate_kinds: { type: array, items: { type: string } }
            measured: { type: boolean, default: true, description: "false when the user did not allow usage analytics. The slate is served and logged with exact propensities, but it stays out of the ledger, the power calculation and all learning in both arms; the app reports no interactions for it. Consent is decided before the list is drawn, so leaving these slates out of both arms keeps the comparison unbiased." }
        slots: { type: integer, minimum: 1, maximum: 50 }
        exclude_item_ids: { type: array, items: { type: string }, maxItems: 200 }
        shadow: { type: boolean, description: log and return but mark as not shown }
        assignment_unit: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: "non_profiled only (ignored in the other modes): a keyed hash the customer computes from its own stable user id, e.g. hex HMAC-SHA256(user id, a key the customer holds). Used only to assign the holdout arm and as the ledger's clustering unit (stored only as a salted hash in unit_hash). Never stored raw, never ranked on, never joined to events. Without it the unit is the rotating session id." }
        deadline_ms: { type: integer, minimum: 10, maximum: 10000, description: "the client's own deadline; same as the X-Deadline-Ms header (the shorter wins)" }

    Slate:
      type: object
      required: [request_id, surface, arm, policy_version, items]
      properties:
        request_id: { type: string }
        surface: { type: string }
        arm: { type: string, enum: [control, treatment, none] }
        policy_version: { type: string }
        flow_version: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/SlateItem' }
        fallback: { type: boolean, description: "true when the non-personalized list was returned as the safety net (timeout, storage trouble, no active flow)" }
        shown: { type: boolean, description: "false when the slate has fewer items than the surface's min_slots: hide the block. Such a slate is logged as not shown and stays out of the ledger and the metrics." }
        latency_ms: { type: integer }

    SlateItem:
      type: object
      required: [item_id, kind, position, reason_key, reason]
      properties:
        item_id: { type: string, description: the customer's external id }
        kind: { type: string }
        position: { type: integer, minimum: 0, description: "0-based: items[0] has position 0" }
        reason_key:
          type: string
          example: similar_to_read
          description: |
            Which signal won the slot; one of similar_to_read, similar, pairs_with, matches_goals,
            more_about_tag, people_like_you, trending, editors_pick, new, popular (a string, so a
            new key is not a breaking change). similar_to_read: item_to_item with an anchor of the same
            kind; pairs_with: an anchor of another kind (article → product); similar: item_to_item
            without an anchor; matches_goals: content_affinity won on a goal the user declared;
            more_about_tag: content_affinity won on behaviour; people_like_you: persona_bayes or
            user_bayes; trending; editors_pick: curated; new: freshness or the newest list;
            popular: the popular list.
        reason:
          type: object
          description: rendered reason text per locale; never contains a placeholder
          additionalProperties: { type: string }
          example: { nl: "Omdat je Magnesium en slaap las", en: "Because you read Magnesium en slaap" }
        generator: { type: string }
        score: { type: number }
        phase_fit: { type: array, items: { type: string }, description: phase tags for on-device re-sorting; never used server-side }

    Interaction:
      type: object
      required: [item_id, position, type, occurred_at]
      properties:
        item_id: { type: string }
        kind: { type: string, description: "ignored: the kind comes from the logged slate" }
        position: { type: integer, minimum: 0, description: "the slot Patterna served (0-based); the engine records the served slot from its log" }
        displayed_position: { type: integer, minimum: 0, description: "where the app showed it (0-based), when it re-sorted on the device; required on a device_resort surface" }
        block: { type: string, maxLength: 32, description: "which block of the page showed it, when one slate is rendered in two places (e.g. top and end); stored and shown in the trace" }
        type: { type: string, enum: [seen, click, dismiss] }
        occurred_at: { type: string, format: date-time }

    Event:
      type: object
      required: [event_id, type, occurred_at, source]
      properties:
        event_id: { type: string }
        type: { type: string }
        occurred_at: { type: string, format: date-time }
        user_id: { type: string }
        session_id: { type: string }
        surface: { type: string }
        request_id: { type: string }
        source: { type: string, enum: [backend, sdk, posthog, ga4, shopify, csv, synthetic] }
        signature: { type: string, description: "lowercase hex HMAC-SHA256 over the canonical JSON of the event without this field (sorted keys, no whitespace); see contracts/events.md" }
        synthetic: { type: boolean, default: false }
        context:
          type: object
          properties:
            locale: { type: string }
            app_version: { type: string }
            platform: { type: string }
            hour_bucket: { type: integer }
          additionalProperties: false
        props: { type: object }

    ItemUpsert:
      type: object
      required: [external_id, kind, title, locale]
      properties:
        external_id: { type: string }
        kind: { type: string, enum: [document, product, community, event, tip] }
        collection: { type: string }
        title: { type: string, description: editorial title only }
        locale: { type: string, description: "the primary locale; stored as its base language (nl-NL → nl)" }
        locales: { type: array, maxItems: 20, items: { type: string }, description: "every locale the item reads in (e.g. a Dutch document with an English translation: [nl, en]); the primary locale is always included" }
        status: { type: string, enum: [draft, scheduled, published, archived], default: published }
        premium: { type: boolean, default: false }
        published_at: { type: string, format: date-time }
        attributes: { type: object, description: "price_cents, currency, difficulty, duration_min, categories[], phase_fit[], image_url, url" }
        text: { type: string, description: "body text for enrichment; stored only as embedding and tags, never returned" }
        tags:
          type: array
          items:
            type: object
            properties:
              tag: { type: string }
              weight: { type: number }

    Item:
      type: object
      properties:
        external_id: { type: string }
        kind: { type: string }
        collection: { type: string }
        title: { type: string }
        locale: { type: string }
        locales: { type: array, items: { type: string } }
        status: { type: string }
        premium: { type: boolean }
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        attributes: { type: object }
        tags:
          type: array
          items:
            type: object
            properties:
              tag: { type: string }
              weight: { type: number }
              source: { type: string }
              approved: { type: boolean }
        enrichment:
          type: object
          properties:
            status: { type: string, enum: [pending, done, failed, skipped] }
            model: { type: string }
            updated_at: { type: string, format: date-time }

    UserProfile:
      type: object
      properties:
        mode: { $ref: '#/components/schemas/Mode' }
        premium: { type: boolean }
        goals: { type: array, items: { type: string }, description: tenant taxonomy tags }
        activity_level: { type: string, enum: [low, moderate, high] }
        stress_level: { type: string, enum: [low, moderate, high] }
        wearable: { type: string }
        supplements_use: { type: string, enum: [none, some, stack] }
        locale: { type: string }

    DeletionRequest:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        requested_at: { type: string, format: date-time }
        rows_deleted_at: { type: [string, 'null'], format: date-time }
        models_retrained_at: { type: [string, 'null'], format: date-time }

    Trace:
      type: object
      properties:
        request_id: { type: string }
        served_at: { type: string, format: date-time }
        surface: { type: string }
        mode: { type: string }
        arm: { type: string }
        policy_version: { type: string }
        explored: { type: boolean }
        slate:
          type: array
          items:
            type: object
            properties:
              item_id: { type: string }
              position: { type: integer }
              propensity: { type: number }
              reason_key: { type: string }
              generator: { type: string }
              contributions: { type: object, additionalProperties: { type: number } }
              outcome: { type: string, enum: [seen, click, dismiss, none] }
              block: { type: string, description: the block the interaction reported }
              displayed_position: { type: integer, description: "where the app showed it, when reported" }

    SurfaceInput:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        item_kinds: { type: array, items: { type: string } }
        slots: { type: integer }
        fallback: { type: object, description: "{ kind: newest | curated, item_ids: [] }" }
        exploration_share: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [shadow, testers, live, off] }
        testers: { type: array, items: { type: string }, maxItems: 200, description: "user ids from the app (never emails)" }
        notes: { type: string, maxLength: 4000, description: placement notes }
        device_resort: { type: boolean, description: "the app re-sorts the slate on the device. Allowed under a holdout (both arms are re-sorted by the same rule, the ledger stays intention to treat on served slates); every interaction must then carry displayed_position. PATCH only." }
        min_slots: { type: integer, minimum: 0, maximum: 50, description: "a slate shorter than this after the filters is returned with shown=false and logged as not shown (outside the ledger and metrics). 0 = always shown. PATCH only." }

    Surface:
      allOf:
        - { $ref: '#/components/schemas/SurfaceInput' }
        - type: object
          properties:
            active_flow_version: { type: [integer, 'null'] }
            impressions_7d: { type: integer }
            tap_rate_7d: { type: [number, 'null'] }
            experiment_id: { type: [string, 'null'] }
            tester_requests_7d: { type: integer, description: "requests marked X-Patterna-Tester: 1 in 7 days" }

    FlowConfig:
      type: object
      description: The versioned recipe of a surface. Generators run in parallel, then filters, ranker, exploration.
      required: [generators, ranker, exploration]
      properties:
        generators:
          type: array
          items:
            type: object
            required: [kind, weight]
            properties:
              kind: { type: string, enum: [trending, curated, item_to_item, content_affinity, persona_bayes, user_bayes, surface_specific] }
              weight: { type: number }
              params: { type: object }
        filters:
          type: object
          properties:
            exclude_seen_days: { type: integer, default: 7 }
            locales: { type: array, items: { type: string } }
            premium_policy: { type: string, enum: [allow, cap, exclude], default: cap }
            premium_cap: { type: integer, default: 2 }
            per_collection_cap: { type: integer, default: 3 }
            freshness_days: { type: [integer, 'null'] }
            diversity: { type: number, minimum: 0, maximum: 1, default: 0, description: "MMR-style penalty applied inside the sampler (score minus diversity x highest tag cosine to the items already picked); logged propensities stay exact" }
        ranker:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [linear, learned_linear, gbdt], description: "gbdt applies the nightly ranker_gbdt policy (gradient-boosted trees over the generators' contributions and item features, exported to JSON and evaluated in the engine); learned_linear applies the nightly ranker_linear policy's per-generator weights (fitted from logged taps) in place of the configured weights" }
            policy_version: { type: string, description: a `policies.version`; empty means the built-in linear weights }
        exploration:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [none, plackett_luce] }
            temperature: { type: number, default: 0.7 }
            share: { type: number, default: 0.2 }
        reasons:
          type: object
          description: |
            Reason templates per key, per locale. A key is a reason key (`matches_goals`,
            `pairs_with`, … see SlateItem.reason_key) or a generator kind (`item_to_item`,
            `trending`, …); for a slot, the reason-key template wins over its generator's, which
            wins over the default text. Placeholders: `{anchor_title}` (the anchor's title),
            `{tag}` (the tag that carried the win, by its taxonomy label in that locale; phases and
            health claims are never named), `{segment}` (the user's persona, by its taxonomy label,
            kind `segment`). A placeholder the request cannot fill is never shipped: that locale
            gets the default text. Unknown keys, locales or placeholders are refused on save (400
            `invalid_reason_template`). A top-level `diversity` key from older clients is ignored
            and dropped; diversity is `filters.diversity`.
          additionalProperties: { type: object, additionalProperties: { type: string, maxLength: 200 } }
          example: { item_to_item: { nl: "Omdat je {anchor_title} las", en: "Because you read {anchor_title}" }, more_about_tag: { nl: "Meer over {tag}" } }

    Flow:
      type: object
      properties:
        version: { type: integer }
        config: { $ref: '#/components/schemas/FlowConfig' }
        note: { type: string }
        created_at: { type: string, format: date-time }
        activated_at: { type: [string, 'null'], format: date-time }
        created_by: { type: [string, 'null'] }

    SimulationResult:
      type: object
      properties:
        days: { type: integer }
        impressions_used: { type: integer }
        effective_sample_size: { type: number }
        metric: { type: string }
        current_policy: { type: number }
        candidate_policy: { type: number }
        ci_low: { type: number }
        ci_high: { type: number }
        note: { type: string }
        twin_curve:
          type: array
          description: from the jobs' latest twin policy for the surface, when one exists
          items:
            type: object
            properties:
              week: { type: integer }
              control: { type: number }
              treatment: { type: number }
        lift_by_truth_scale: { type: object, additionalProperties: true }

    ExperimentInput:
      type: object
      required: [surface, name, primary_metric]
      properties:
        surface: { type: string }
        name: { type: string }
        treatment_share: { type: number, default: 0.5 }
        primary_metric:
          type: string
          enum: [tap_rate, second_item_rate, join_rate, engaged_after_tap]
          description: |
            Per served slate (intention to treat), clustered on the unit:
            tap_rate: at least one tap. second_item_rate: after the slate's first tap, a tap on
            another item in the same session (session id, else the unit) within 30 minutes.
            join_rate (surfaces that serve communities, else 400 metric_not_applicable): a
            community_joined for a community in the slate within 7 days, by the slate's user,
            session or request. engaged_after_tap: item_engaged or item_completed for a tapped item
            within 7 days of the tap, same identity match. Unmeasured and not-shown slates are
            outside every metric.
        stratify_by: { type: string, default: persona }
        baseline_rate: { type: number }
        relative_change: { type: number, description: "the change to detect, e.g. 0.2" }

    Experiment:
      allOf:
        - { $ref: '#/components/schemas/ExperimentInput' }
        - type: object
          properties:
            id: { type: string }
            started_at: { type: [string, 'null'], format: date-time }
            ended_at: { type: [string, 'null'], format: date-time }
            readable_sample: { type: integer }
            n_control: { type: integer }
            n_treatment: { type: integer }
            readable_at: { type: [string, 'null'], format: date, description: projected date the sample is reached }

    LedgerRow:
      type: object
      properties:
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        surface: { type: string }
        metric: { type: string }
        control_rate: { type: number }
        treatment_rate: { type: number }
        difference: { type: number }
        ci_low: { type: [number, 'null'], description: null while an arm has fewer than two units }
        ci_high: { type: [number, 'null'] }
        n_control: { type: integer }
        n_treatment: { type: integer }
        n_users_control: { type: integer }
        n_users_treatment: { type: integer }
        srm_p: { type: number, description: sample-ratio-mismatch p-value; below 0.001 the row must not be read }
        note: { type: string }
        readable: { type: boolean, description: false below the readable sample; interval shown dashed }
        revenue_cents_control: { type: [integer, 'null'] }
        revenue_cents_treatment: { type: [integer, 'null'] }
        export_uri: { type: [string, 'null'] }

    ConnectorRun:
      type: object
      properties:
        source: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        status: { type: string }
        rows_in: { type: integer }
        rows_mapped: { type: integer }
        fields_dropped: { type: object, additionalProperties: { type: integer } }
        error: { type: [string, 'null'] }
        health: { type: string, enum: [ok, failing, never] }
        last_event_at: { type: string, format: date-time, description: 'backend and SDK sources: from events of the last 30 days' }
        config:
          type: object
          properties:
            webhook_url: { type: [string, 'null'] }
            key_prefix: { type: [string, 'null'], description: prefix of the newest ingest key (never the secret) }
            docs_href: { type: string }

    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        scope: { type: string }
        prefix: { type: string }
        environment: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time, description: from key_usage (flushed every 10 s) }
        requests_today: { type: integer }
        requests_14d: { type: array, items: { type: integer }, minItems: 14, maxItems: 14, description: 'requests per UTC day, oldest first, today last' }
        expires_at: { type: [string, 'null'], format: date-time }
        created_by: { type: [string, 'null'], description: email of the person who minted it }

    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        actor: { type: [string, 'null'] }
        action: { type: string }
        target: { type: string }
        diff: { type: [object, 'null'] }
        at: { type: string, format: date-time }
        tenant: { type: [string, 'null'], description: tenant slug (operator audit only) }

    Ok:
      type: object
      properties:
        ok: { type: boolean }

    Overview:
      type: object
      properties:
        checklist:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [connect_source, import_catalog, enrich_tags, create_surface, go_shadow, add_testers, go_live_holdout, first_readable_ledger] }
              title: { type: string }
              state: { type: string, enum: [done, todo, blocked] }
              href: { type: string }
        status:
          type: object
          properties:
            engine_version: { type: string }
            jobs_last_run_at: { type: [string, 'null'], format: date-time }
            items: { type: integer }
            impressions_7d: { type: integer }
            fallback_rate_7d: { type: [number, 'null'] }
            p99_ms_7d: { type: [number, 'null'] }
            alerts:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [srm, fallback_rate, connector_failure] }
                  surface: { type: string }
                  message: { type: string }
                  since: { type: string, format: date-time }
        changes:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              actor: { type: [string, 'null'] }
              action: { type: string }
              target: { type: string }
        analyst_note:
          description: the newest weekly analyst note of the data set (include_synthetic), or null
          oneOf: [{ $ref: '#/components/schemas/AnalystNote' }, { type: 'null' }]

    SurfaceMetrics:
      type: object
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              impressions: { type: integer }
              taps: { type: integer }
              tap_rate: { type: [number, 'null'] }
              fallback_rate: { type: [number, 'null'], description: "safety-net fallbacks plus slates the client abandoned, over slates shown" }
              client_abandoned_rate: { type: [number, 'null'] }
              unmeasured_share: { type: [number, 'null'], description: "slates requested with context.measured=false (outside the ledger and learning)" }
              p99_ms: { type: [number, 'null'] }
              explored_share: { type: [number, 'null'] }

    PreviewRequest:
      type: object
      properties:
        user_id: { type: string }
        session_id: { type: string, description: generated when absent in non_profiled mode }
        mode: { $ref: '#/components/schemas/Mode' }
        locale: { type: string, default: nl }
        flow_version: { type: integer, description: preview a draft version }
        slots: { type: integer }

    Preview:
      type: object
      properties:
        slate: { $ref: '#/components/schemas/Slate' }
        contributions:
          type: object
          description: item id → generator → contribution
          additionalProperties: { type: object, additionalProperties: { type: number } }

    CuratedItem:
      type: object
      required: [item_id]
      properties:
        item_id: { type: string }
        order: { type: integer, description: ascending; defaults to the position in the list }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: exclusive }

    CuratedListInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CuratedItem' } }

    CuratedList:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/CuratedItem' } }
        created_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImpressionStream:
      type: object
      properties:
        cursor: { type: string, format: date-time }
        impressions:
          type: array
          items:
            type: object
            properties:
              request_id: { type: string }
              served_at: { type: string, format: date-time }
              surface: { type: string }
              mode: { type: string }
              arm: { type: string }
              flow_version: { type: integer }
              policy_version: { type: string }
              fallback: { type: boolean }
              explored: { type: boolean }
              shadow: { type: boolean }
              latency_ms: { type: integer }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    item_id: { type: string }
                    position: { type: integer }
                    propensity: { type: number }
                    reason_key: { type: string }
                    generator: { type: string }

    LedgerWeek:
      type: object
      properties:
        week_start: { type: string, format: date }
        surface: { type: string }
        arm: { type: string, enum: [control, treatment] }
        impressions: { type: integer, description: impressions reported as seen }
        taps: { type: integer }
        rate: { type: number }
        lo: { type: number }
        hi: { type: number }
        users: { type: integer, description: randomised units with a seen impression that week }

    Power:
      type: object
      properties:
        baseline: { type: number }
        relative_change: { type: number }
        readable_sample: { type: integer, description: per arm }
        curve:
          type: array
          items:
            type: object
            properties:
              relative_change: { type: number }
              sample: { type: integer }

    TaxonomyTagInput:
      type: object
      required: [tag]
      properties:
        tag: { type: string }
        kind: { type: string, enum: [topic, goal, format, audience, phase, claim, segment], default: topic, description: "segment names a persona for the {segment} reason placeholder" }
        parent: { type: [string, 'null'] }
        health_claim: { type: boolean }
        labels: { type: object, additionalProperties: { type: string, maxLength: 60 }, description: "the tag's name in reasons per locale, e.g. {nl: slaap, en: sleep}; a tag without a label for a locale is never named there" }

    TaxonomyTag:
      allOf:
        - { $ref: '#/components/schemas/TaxonomyTagInput' }
        - type: object
          properties:
            items: { type: integer }
            in_taxonomy: { type: boolean, description: false for tags in use that the taxonomy does not list }

    SimilarItem:
      type: object
      properties:
        external_id: { type: string }
        kind: { type: string }
        title: { type: string }
        score: { type: number }
        shared_tags: { type: array, items: { type: string } }
        basis: { type: string, enum: [embedding, tags] }

    ItemStats:
      type: object
      properties:
        days: { type: integer }
        impressions: { type: integer }
        taps: { type: integer }
        tap_rate: { type: [number, 'null'] }
        positions: { type: array, items: { type: object, properties: { position: { type: integer }, count: { type: integer } } } }
        surfaces: { type: array, items: { type: object, properties: { surface: { type: string }, impressions: { type: integer }, taps: { type: integer } } } }

    Cluster:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer }
        top_tags: { type: array, items: { type: string } }
        examples: { type: array, items: { type: object, properties: { external_id: { type: string }, title: { type: string } } } }

    ConnectorTest:
      type: object
      properties:
        ok: { type: boolean }
        mapped: { type: integer }
        dropped_fields: { type: object, additionalProperties: { type: integer } }
        skipped: { type: integer }
        message: { type: string }
        payload: { type: string, enum: [provided, synthetic] }

    WebhookEndpoint:
      type: object
      required: [url, events]
      properties:
        url: { type: string, description: https }
        events: { type: array, items: { type: string, enum: [flow.activated, surface.status_changed, ledger.published] } }

    Settings:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        accent: { type: string }
        default_mode: { $ref: '#/components/schemas/Mode' }
        daily_llm_budget_cents: { type: integer }
        settings: { type: object }
        locale_default: { type: string, enum: [nl, en] }
        session_rotation_hours: { type: integer }
        exploration_default: { type: number }
        premium_policy_default: { type: string, enum: [allow, cap, exclude] }
        two_person_rule: { type: boolean }
        suspended_at: { type: [string, 'null'], format: date-time }
        paused: { type: boolean }
        deletion_scheduled_for: { type: [string, 'null'], format: date-time, description: set by POST /settings/delete-workspace }
        deletion_requested_at: { type: [string, 'null'], format: date-time }
        signing_secret: { type: object, properties: { set: { type: boolean }, issued_at: { type: [string, 'null'], format: date-time } } }
        connector_credentials:
          type: object
          description: write-only credentials; only whether each is set
          properties:
            posthog_token: { type: object, properties: { set: { type: boolean } } }
            shopify_webhook_secret: { type: object, properties: { set: { type: boolean } } }
        webhooks: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
        alerts:
          type: object
          properties:
            email: { type: string }
            slack_webhook: { type: object, description: 'write-only: whether it is set and its last characters', properties: { set: { type: boolean }, hint: { type: string } } }
            srm: { type: boolean }
            fallback_rate_pct: { type: number }
            connector_failures: { type: boolean }
            ledger_published: { type: boolean }
        llm:
          type: object
          properties:
            provider_overrides: { type: object, additionalProperties: { type: string } }
            model_pins: { type: object, additionalProperties: { type: string } }
            budget_cents: { type: integer }
            spend_today_cents: { type: integer }

    SettingsPatch:
      type: object
      properties:
        name: { type: string }
        accent: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        default_mode: { $ref: '#/components/schemas/Mode' }
        daily_llm_budget_cents: { type: integer }
        locale_default: { type: string, enum: [nl, en] }
        session_rotation_hours: { type: integer, minimum: 1, maximum: 720 }
        exploration_default: { type: number, minimum: 0, maximum: 0.5 }
        premium_policy_default: { type: string, enum: [allow, cap, exclude] }
        two_person_rule: { type: boolean }
        webhooks: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
        posthog_token: { type: string, description: "24 to 200 random characters the PostHog destination sends in X-Patterna-Token; stored as its SHA-256; empty removes it" }
        shopify_webhook_secret: { type: string, maxLength: 200, description: "the Shopify app's webhook signing secret; never returned; empty removes it (and the Shopify webhook then refuses every call)" }
        alerts:
          type: object
          properties:
            email: { type: string }
            slack_webhook: { type: string, description: "https://hooks.slack.com/... ; empty clears" }
            srm: { type: boolean }
            fallback_rate_pct: { type: number }
            connector_failures: { type: boolean }
            ledger_published: { type: boolean }
        llm:
          type: object
          properties:
            provider_overrides: { type: object, additionalProperties: { type: string } }
            model_pins: { type: object, additionalProperties: { type: string } }
            budget_cents: { type: integer }

    PauseResult:
      type: object
      properties:
        ok: { type: boolean }
        surfaces: { type: array, items: { type: string }, description: the surfaces whose status changed }

    RetentionPolicy:
      type: object
      required: [data_class, days]
      properties:
        data_class: { type: string, enum: [events, impressions, interactions, exports, audit, sessions] }
        days: { type: integer, minimum: 1, maximum: 3650 }

    Notification:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [srm, fallback_rate, connector_failure, ledger_published, flow_activated, deletion_completed, approval_requested, approval_decided, surface_status, alert_test, workspace_deletion, report_sent] }
        message: { type: string }
        target: { type: string }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    NotificationList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        unread: { type: integer }

    ApprovalInput:
      type: object
      required: [kind, target]
      properties:
        kind: { type: string, enum: [flow_activation, claim_tag, workspace_deletion], description: "workspace_deletion requests are created by POST /settings/delete-workspace only; POST /approvals refuses them" }
        target: { type: string, description: "flow_activation: <surface>@<version>; claim_tag: <kind>/<external_id>/<tag>; workspace_deletion: the slug" }
        note: { type: string }

    Approval:
      allOf:
        - { $ref: '#/components/schemas/ApprovalInput' }
        - type: object
          properties:
            id: { type: string }
            requested_by: { type: [string, 'null'] }
            approved_by: { type: [string, 'null'], description: the deciding user (also on rejection) }
            state: { type: string, enum: [pending, approved, rejected] }
            decision_note: { type: string }
            created_at: { type: string, format: date-time }
            decided_at: { type: [string, 'null'], format: date-time }

    ScheduledReportInput:
      type: object
      properties:
        name: { type: string }
        screen: { type: string, enum: [proof, surfaces, catalog], default: proof }
        surface: { type: [string, 'null'] }
        recipients: { type: array, items: { type: string, format: uuid }, description: panel user ids of this workspace }
        cadence: { type: string, enum: [weekly, monthly] }
        locale: { type: string, enum: [nl, en], default: nl }

    ScheduledReport:
      allOf:
        - { $ref: '#/components/schemas/ScheduledReportInput' }
        - type: object
          properties:
            id: { type: string }
            created_by: { type: [string, 'null'] }
            created_at: { type: string, format: date-time }
            last_sent_at: { type: [string, 'null'], format: date-time }
            last_status: { type: [string, 'null'] }

    OutboxEntry:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        event: { type: string, enum: [flow.activated, surface.status_changed, ledger.published, test] }
        payload: { type: object }
        attempts: { type: integer }
        last_error: { type: [string, 'null'] }
        next_attempt_at: { type: string, format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    SavedViewInput:
      type: object
      properties:
        screen: { type: string, description: required on create; fixed afterwards }
        name: { type: string }
        state: { type: object, description: 'filters and columns, at most 64 KiB' }

    SavedView:
      type: object
      properties:
        id: { type: string }
        screen: { type: string }
        name: { type: string }
        state: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- accounts ----------
    TenantRole:
      type: string
      enum: [owner, editor, viewer]

    CodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, description: six-digit TOTP code }

    MembershipRef:
      type: object
      required: [slug, name, role]
      properties:
        slug: { type: string }
        name: { type: string }
        accent: { type: string }
        role: { type: string, enum: [owner, editor, viewer, staff] }

    Me:
      type: object
      required: [id, email, name, role, is_staff, mfa_enabled, mfa_setup_required, memberships]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, editor, viewer, staff], description: role in the current tenant }
        is_staff: { type: boolean }
        mfa_enabled: { type: boolean }
        mfa_setup_required: { type: boolean, description: "staff, or the tenant enforces MFA, and no TOTP yet: only enrolment calls are allowed" }
        last_login_at: { type: [string, 'null'], format: date-time }
        idle_timeout_minutes: { type: integer }
        support: { type: boolean, description: staff inside a tenant they are not a member of }
        tenant:
          type: [object, 'null']
          properties:
            slug: { type: string }
            name: { type: string }
            accent: { type: string }
            accent_secondary: { type: [string, 'null'] }
            locale_default: { type: string }
            mfa_required: { type: boolean }
            suspended: { type: boolean }
        memberships: { type: array, items: { $ref: '#/components/schemas/MembershipRef' } }

    Session:
      type: object
      required: [id, created_at, last_seen_at, expires_at, via, client, current]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        via: { type: string, description: "password, invite, reset or orven:<email>" }
        client: { type: string, description: 'coarse, for example Chrome on macOS; no address is stored' }
        tenant: { type: [string, 'null'], description: tenant slug }
        current: { type: boolean }

    Member:
      type: object
      required: [id, email, name, role, mfa_enabled, created_at, active_sessions]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/TenantRole' }
        mfa_enabled: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time, description: when the membership started }
        active_sessions: { type: integer }

    Invite:
      type: object
      required: [id, email, role, state, created_at, expires_at]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, editor, viewer, staff] }
        state: { type: string, enum: [pending, accepted, expired, revoked] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        invited_by: { type: [string, 'null'], description: the inviter's email }

    InviteInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { $ref: '#/components/schemas/TenantRole' }
        locale: { type: string, enum: [nl, en] }

    InvitePreview:
      type: object
      required: [email, role, expires_at, existing_account, mfa_required]
      properties:
        email: { type: string }
        name: { type: string, description: 'the name the inviter gave, if any' }
        role: { type: string }
        tenant:
          type: [object, 'null']
          properties:
            slug: { type: string }
            name: { type: string }
            accent: { type: string }
        expires_at: { type: string, format: date-time }
        existing_account: { type: boolean }
        mfa_required: { type: boolean }

    SecuritySettings:
      type: object
      required: [mfa_required, idle_timeout_minutes, members_without_mfa]
      properties:
        mfa_required: { type: boolean }
        idle_timeout_minutes: { type: integer }
        members_without_mfa: { type: integer }

    KeyInput:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope: { type: string, enum: [ingest, serve, admin] }
        environment: { type: string, default: production }
        expires_in_days: { type: integer, minimum: 1, maximum: 730 }

    Account:
      type: object
      required: [id, email, name, is_staff, mfa_enabled, disabled, created_at, active_sessions, memberships]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        is_staff: { type: boolean }
        mfa_enabled: { type: boolean }
        disabled: { type: boolean }
        locked_until: { type: [string, 'null'], format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        active_sessions: { type: integer }
        memberships: { type: array, items: { $ref: '#/components/schemas/MembershipRef' } }

    TenantInput:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$' }
        name: { type: string }
        accent: { type: string }
        accent_secondary: { type: string }
        locale_default: { type: string, enum: [nl, en] }
        default_mode: { $ref: '#/components/schemas/Mode' }
        daily_llm_budget_cents: { type: integer }
        plan: { type: string, enum: [trial, standard, enterprise] }
        request_quota_monthly: { type: integer, minimum: 1 }
        seats: { type: integer, minimum: 1 }
        owner_email: { type: string, description: the first owner; invited by email }
        owner_name: { type: string }

    StaffTenant:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        accent: { type: string }
        accent_secondary: { type: [string, 'null'] }
        locale_default: { type: string }
        default_mode: { type: string }
        daily_llm_budget_cents: { type: integer }
        plan: { type: string, enum: [trial, standard, enterprise] }
        request_quota_monthly: { type: [integer, 'null'] }
        seats: { type: [integer, 'null'] }
        mfa_required: { type: boolean }
        created_at: { type: string, format: date-time }
        suspended_at: { type: [string, 'null'], format: date-time }
        usage:
          type: object
          properties:
            requests_7d: { type: integer }
            impressions_7d: { type: integer }
            llm_cents_30d: { type: integer }
            surfaces_live: { type: integer }
            requests_30d: { type: integer, description: 'every logged slate, shadow included' }
            impressions_30d: { type: integer, description: shown slates only }
            items: { type: integer }
            users: { type: integer, description: profiled end users (random ids) }
            members: { type: integer, description: panel memberships }
            keys_active: { type: integer }

    PlatformHealth:
      type: object
      properties:
        engine: { type: object, properties: { version: { type: string }, migrations: { type: array, items: { type: string } } } }
        jobs:
          type: object
          properties:
            version: { type: [string, 'null'] }
            last_runs: { type: array, items: { type: object, properties: { tenant: { type: string }, job: { type: string }, at: { type: string, format: date-time }, status: { type: string } } } }
        stores:
          type: object
          properties:
            postgres_size_mb: { type: number }
            last_dump_at: { type: [string, 'null'] }
            wal_archived_count: { type: integer }
            wal_last_archived_at: { type: [string, 'null'], format: date-time }
        errors_1h: { type: integer, description: 5xx answered by this engine process in the last hour }
        p99_ms_by_tenant: { type: object, additionalProperties: { type: [number, 'null'] } }
        deletion_queue: { type: integer }

    PlatformSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        providers: { type: object, description: "provider → options (no credentials)" }
        model_pins: { type: object }
        default_budget_cents: { type: integer }
        retention_defaults: { type: object, additionalProperties: { type: integer } }
        feature_flags: { type: object, additionalProperties: { type: boolean } }
        prices:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              model: { type: string }
              input_usd_per_mtok: { type: number }
              output_usd_per_mtok: { type: number }

    PlatformSettings:
      allOf:
        - { $ref: '#/components/schemas/PlatformSettingsPatch' }
        - type: object
          properties:
            prices:
              type: array
              items:
                type: object
                properties:
                  provider: { type: string }
                  model: { type: string }
                  input_usd_per_mtok: { type: number }
                  output_usd_per_mtok: { type: number }
                  effective_from: { type: string, format: date }

    # ---- panel backends ------------------------------------------------------------------------
    ConnectorSource:
      type: object
      properties:
        source: { type: string, enum: [backend, sdk, posthog, ga4, shopify, csv] }
        status: { type: string, enum: [connected, failing, not_connected] }
        health: { type: string, enum: [ok, failing, never] }
        last_run: { oneOf: [{ $ref: '#/components/schemas/ConnectorSourceRun' }, { type: 'null' }] }
        runs: { type: array, items: { $ref: '#/components/schemas/ConnectorSourceRun' }, description: the ten newest runs }
        last_event_at: { type: [string, 'null'], format: date-time }
        events_7d: { type: integer, description: events received from this source in 7 days (real rows) }
        config:
          type: object
          properties:
            webhook_url: { type: [string, 'null'] }
            key_prefix: { type: [string, 'null'] }
            docs_href: { type: string }

    ConnectorSourceRun:
      type: object
      properties:
        id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        status: { type: string }
        rows_in: { type: integer }
        rows_mapped: { type: integer }
        fields_dropped: { type: object, additionalProperties: { type: integer } }
        error: { type: [string, 'null'] }

    AlertTestResult:
      type: object
      properties:
        notification_id: { type: string }
        email: { type: string, enum: [queued, not_configured, unavailable], description: 'unavailable: no email outbox in this deployment' }
        slack: { type: string, enum: [configured, not_configured] }

    EnrichmentRun:
      type: object
      properties:
        id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [running, done, partial, failed] }
        model: { type: [string, 'null'] }
        items: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        retry_later: { type: integer }
        tags_added: { type: integer }
        cost_cents: { type: number }
        stopped_reason: { type: [string, 'null'] }
        item:
          type: object
          description: with ?external_id, that item's outcome in this run
          properties:
            external_id: { type: string }
            kind: { type: string }
            status: { type: string, enum: [done, failed, retry_later, stopped_budget] }
            tags_added: { type: integer }
            cost_usd: { type: number }
            model: { type: string }
            error: { type: string }

    EnrichmentHistory:
      type: object
      properties:
        model: { type: [string, 'null'], description: the newest run's tagging model }
        runs_30d: { type: integer }
        items_done_30d: { type: integer }
        cost_cents_30d: { type: number }
        runs: { type: array, items: { $ref: '#/components/schemas/EnrichmentRun' } }

    GoldSetInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            required: [external_id, tags]
            properties:
              external_id: { type: string }
              kind: { type: string, default: document }
              tags: { type: array, items: { type: string } }
        note: { type: string }

    GoldSet:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              external_id: { type: string }
              kind: { type: string }
              title: { type: string }
              gold: { type: array, items: { type: string } }
              current: { type: array, items: { type: string }, description: approved tags now }
              matched: { type: array, items: { type: string } }
              extra: { type: array, items: { type: string }, description: current but not gold (false positives) }
              missing: { type: array, items: { type: string }, description: gold but not current (false negatives) }
              labelled_at: { type: string, format: date-time }
        score: { $ref: '#/components/schemas/GoldScore' }
        history:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              items: { type: integer }
              matched: { type: integer }
              extra: { type: integer }
              missing: { type: integer }
              precision: { type: [number, 'null'] }
              recall: { type: [number, 'null'] }
              f1: { type: [number, 'null'] }
              scored_by: { type: [string, 'null'] }
        sample:
          type: array
          items:
            type: object
            properties:
              external_id: { type: string }
              kind: { type: string }
              title: { type: string }
              collection: { type: string }
              current: { type: array, items: { type: string } }

    GoldScore:
      type: object
      description: micro-averaged over every labelled (item, tag) pair; null when the denominator is zero
      properties:
        items: { type: integer }
        matched: { type: integer }
        extra: { type: integer }
        missing: { type: integer }
        precision: { type: [number, 'null'] }
        recall: { type: [number, 'null'] }
        f1: { type: [number, 'null'] }

    BulkItemsInput:
      type: object
      required: [external_ids]
      properties:
        external_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
        kind: { type: string, description: empty matches every kind carrying the id }
        status: { type: string, enum: [draft, scheduled, published, archived] }
        collection: { type: string }
        add_tags: { type: array, items: { type: string } }
        remove_tags: { type: array, items: { type: string } }
        approve_tags: { type: boolean }
        re_enrich: { type: boolean }
        note: { type: string }

    BulkItemsResult:
      type: object
      properties:
        matched: { type: integer }
        updated: { type: integer, description: items with at least one change }
        not_found: { type: array, items: { type: string } }
        approvals_requested: { type: integer }
        re_enrich_queued: { type: integer }

    CohortStats:
      type: object
      properties:
        users: { type: integer }
        share: { type: [number, 'null'], description: of all profiled users }
        impressions: { type: integer }
        seen: { type: integer }
        taps: { type: integer }
        tap_rate: { type: [number, 'null'], description: taps over seen }

    Cohorts:
      type: object
      properties:
        days: { type: integer }
        users: { type: integer, description: profiled users in the data set }
        goals:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/CohortStats' }
              - type: object
                properties:
                  goal: { type: string }
                  top_personas: { type: array, items: { type: object, properties: { persona: { type: string }, users: { type: integer } } } }
        personas:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/CohortStats' }
              - type: object
                properties:
                  persona: { type: string }

    ConsentTimeline:
      type: object
      properties:
        weeks:
          type: array
          items:
            type: object
            properties:
              week_start: { type: string, format: date }
              personalized: { type: integer }
              cohort: { type: integer }
              non_profiled: { type: integer }
              total: { type: integer }
        totals:
          type: object
          properties:
            personalized: { type: integer }
            cohort: { type: integer }
            non_profiled: { type: integer }

    Heatmap:
      type: object
      properties:
        surface: { type: string }
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        slots:
          type: array
          items:
            type: object
            properties:
              position: { type: integer }
              impressions: { type: integer }
              seen: { type: integer }
              taps: { type: integer }
              seen_rate: { type: [number, 'null'] }
              tap_rate: { type: [number, 'null'] }
              explored_share: { type: [number, 'null'] }
              reasons: { type: object, additionalProperties: { type: integer } }
        cells:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              position: { type: integer }
              impressions: { type: integer }
              seen: { type: integer }
              taps: { type: integer }
              seen_rate: { type: [number, 'null'] }
              tap_rate: { type: [number, 'null'] }

    AnnotationInput:
      type: object
      required: [at, text]
      properties:
        surface: { type: [string, 'null'] }
        at: { type: string, description: date or RFC 3339 time }
        text: { type: string, minLength: 1, maxLength: 500 }

    Annotation:
      type: object
      properties:
        id: { type: string, description: 'a note id, or audit:<n> for a change from the audit log' }
        source: { type: string, enum: [note, audit] }
        kind: { type: string, enum: [note, flow_activated, status_changed, surface_created, experiment_started, experiment_ended, paused, resumed] }
        surface: { type: [string, 'null'] }
        at: { type: string, format: date-time }
        text: { type: string }
        author: { type: [string, 'null'] }
        author_email: { type: [string, 'null'] }

    PresenceEntry:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string }
        role: { type: string }
        path: { type: string }
        last_seen: { type: string, format: date-time }

    ReportSend:
      type: object
      properties:
        id: { type: string }
        report_id: { type: string }
        trigger: { type: string, enum: [manual, schedule] }
        status: { type: string, enum: [queued, sending, sent, failed] }
        recipients: { type: integer }
        requested_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }

    WorkspaceExport:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [done, failed] }
        files: { type: array, items: { type: string } }
        bytes: { type: integer }
        download_url: { type: string, description: path under /v1 }

    WorkspaceDeletion:
      type: object
      properties:
        state: { type: string, enum: [scheduled, pending_approval] }
        scheduled_for: { type: [string, 'null'], format: date-time }
        approval: { $ref: '#/components/schemas/Approval' }

    AnalystNote:
      type: object
      properties:
        id: { type: string }
        week_start: { type: string, format: date }
        created_at: { type: string, format: date-time }
        model: { type: [string, 'null'] }
        headline: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [moved, steady, try] }
              text: { type: string }
              figures: { type: array, items: { type: string }, description: figure names cited in the text (link targets) }
        figures: { type: object, additionalProperties: { type: number }, description: the inputs every number in the note was checked against }
