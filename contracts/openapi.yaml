  # ---------- accounts (docs/ACCOUNTS_API.md) ----------
  /auth/login:
    post:
      tags: [accounts]
      security: []
      summary: Sign in with email and password
      operationId: authLogin
      description: |
        Sets the session cookie. Failures count per email and per client address: 5 for one email
        in 15 minutes lock it for 15 minutes (`account_locked`), 30 from one address refuse that
        address (`too_many_attempts`). An unknown email, a wrong password and a disabled account
        all answer `bad_credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        '200':
          description: signed in (MFA may still be due)
          content:
            application/json:
              schema: { type: object, required: [mfa_required, mfa_setup_required], properties: { mfa_required: { type: boolean }, mfa_setup_required: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mfa:
    post:
      tags: [accounts]
      security: []
      summary: Complete sign-in with a TOTP code
      operationId: authMfa
      description: Five wrong codes in 15 minutes drop the session (`too_many_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/orven-sso:
    post:
      tags: [accounts]
      security: []
      summary: Optional staff sign-in from Orven (magic login)
      operationId: authOrvenSso
      description: |
        Only when `PATTERNA_ORVEN_SSO_SECRET` is set. The token's `iat` must lie within the last 5
        minutes (30 s skew), `exp` in the future and at most 5 minutes after `iat`; the nonce is
        single use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: End this session
      operationId: authLogout
      responses:
        '204': { description: signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: The signed-in person, the current tenant and their memberships
      operationId: authMe
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [accounts]
      security: [{ panelSession: [] }]
      summary: Update your profile
      operationId: authUpdateMe
      requestBody:
        required: true
        content:
