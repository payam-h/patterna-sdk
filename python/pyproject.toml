[project]
name = "patterna-sdk"
version = "0.4.0"
description = "Python client for the Patterna recommendation API: serve, ingest, signed events, consent gate."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patterna_sdk"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
strict = true
files = ["patterna_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://patterna.orven.am/docs"
Repository = "https://github.com/payam-h/patterna-sdk"
